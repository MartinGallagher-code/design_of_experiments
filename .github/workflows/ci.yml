name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Without this, a failure on one interpreter cancels the others and
      # hides whether they would have passed.
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install dependencies
        run: |
          # setuptools is upgraded alongside pip because the runner's
          # preinstalled copy can carry known vulnerabilities that fail the
          # pip-audit step below (e.g. PYSEC-2026-3447 in setuptools 79.0.1).
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      - name: Check dependencies for vulnerabilities
        # Advisory-only on 3.9, blocking everywhere else. Python 3.9 reached
        # end of life in October 2025 and most upstreams have stopped
        # publishing wheels for it, so the patched releases pip-audit asks for
        # are unavailable there: pillow 12.x, click 8.3.3, pytest 9.0.3,
        # requests 2.33, urllib3 2.7, filelock 3.20, msgpack 1.2.1 and
        # setuptools 83 all require >=3.10. The audit still runs and still
        # prints its findings to the log on 3.9 — the results are visible,
        # they just cannot gate a build that has nothing to upgrade to.
        # Remove this once 3.9 is dropped from the matrix.
        continue-on-error: ${{ matrix.python-version == '3.9' }}
        run: |
          pip-audit --skip-editable

      - name: Check REUSE license compliance
        run: |
          # Whole-repo REUSE compliance: doe/ source files carry in-file SPDX
          # headers; everything else is covered by the REUSE.toml catch-all.
          # Keeping this green keeps the api.reuse.software badge green.
          reuse lint

      - name: Syntax check
        run: |
          python -m compileall -q doe tests

      - name: Lint (ruff, fail-on-issue)
        run: |
          ruff check doe tests

      - name: Security analysis (bandit)
        run: |
          bandit -r doe --exit-zero

      - name: Type check (mypy)
        run: |
          mypy doe

      - name: Run tests
        # The 100% gate is enforced on 3.10+, and the report is printed but not
        # gated on 3.9. Precise line events arrived with PEP 626 in 3.10; before
        # that the tracer does not record a statement that follows an if-block
        # ending in its own jump, even though the statement runs. Two such
        # statements exist here — the `continue` in _weighted_sse and the one in
        # _residual_metrics — so the same suite measures 99.97% on 3.9 and 100%
        # on 3.12. The report is still printed on 3.9, so a genuine coverage
        # regression there stays visible in the log.
        run: |
          if [ "${{ matrix.python-version }}" = "3.9" ]; then
            fail_under=0
          else
            fail_under=100
          fi
          pytest tests/ -v --tb=short --cov=doe --cov-report=xml \
            --cov-report=html --cov-report=term-missing \
            --cov-fail-under="$fail_under"

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          # Public repos work tokenless, but v4+ uploads are flaky without it;
          # set the CODECOV_TOKEN repo secret to make uploads reliable.
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml
