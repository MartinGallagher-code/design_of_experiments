name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install dependencies
        run: |
          # setuptools is upgraded alongside pip because the runner's
          # preinstalled copy can carry known vulnerabilities that fail the
          # pip-audit step below (e.g. PYSEC-2026-3447 in setuptools 79.0.1).
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      - name: Check dependencies for vulnerabilities
        run: |
          pip-audit --skip-editable

      - name: Check REUSE license compliance
        run: |
          # Whole-repo REUSE compliance: doe/ source files carry in-file SPDX
          # headers; everything else is covered by the REUSE.toml catch-all.
          # Keeping this green keeps the api.reuse.software badge green.
          reuse lint

      - name: Syntax check
        run: |
          python -m compileall -q doe tests

      - name: Lint (ruff, fail-on-issue)
        run: |
          ruff check doe tests

      - name: Security analysis (bandit)
        run: |
          bandit -r doe --exit-zero

      - name: Type check (mypy)
        run: |
          mypy doe

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=doe --cov-report=xml --cov-report=html --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml
