name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ubuntu-latest became 26.04 in November 2026, and setup-python has no
    # 3.9 for it; 24.04 still has every version in the matrix (quarterdeck
    # QD-014 did the same).
    runs-on: ubuntu-24.04
    strategy:
      # Without this, the first job to fail cancels the rest and we lose the
      # signal from every other interpreter in the same run.
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install dependencies
        run: |
          # setuptools is upgraded alongside pip because the runner's
          # preinstalled copy can carry known vulnerabilities that fail the
          # pip-audit step below (e.g. PYSEC-2026-3447 in setuptools 79.0.1).
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      # The static and environment-level gates below check the repository, not
      # the interpreter, so they run once on the newest supported version
      # rather than once per matrix entry. Pinning them to 3.12 also keeps
      # them meaningful: on 3.9 (EOL since October 2025) pip can only resolve
      # the last 3.9-compatible release of each transitive dependency, and
      # several of those carry advisories whose fixes ship only in releases
      # requiring 3.10+ (e.g. pillow 11.3.0, fixed in 12.x). Auditing there
      # reports findings that no dependency bump in this repo can clear.
      - name: Check dependencies for vulnerabilities
        if: matrix.python-version == '3.12'
        run: |
          pip-audit --skip-editable

      - name: Check REUSE license compliance
        if: matrix.python-version == '3.12'
        run: |
          # Whole-repo REUSE compliance: doe/ source files carry in-file SPDX
          # headers; everything else is covered by the REUSE.toml catch-all.
          # Keeping this green keeps the api.reuse.software badge green.
          reuse lint

      - name: Syntax check
        run: |
          python -m compileall -q doe tests

      - name: Lint (ruff, fail-on-issue)
        if: matrix.python-version == '3.12'
        run: |
          ruff check doe tests

      - name: Security analysis (bandit)
        if: matrix.python-version == '3.12'
        run: |
          bandit -r doe --exit-zero

      # mypy targets the interpreter it runs under and current releases refuse
      # to target 3.9 at all, so check types once on 3.12 rather than per entry.
      - name: Type check (mypy)
        if: matrix.python-version == '3.12'
        run: |
          mypy doe

      # The 100% gate is enforced on 3.10+ only. Python 3.9 predates PEP 626
      # (precise line numbers, added in 3.10): a `continue` that ends an `if`
      # inside a nested loop emits no line event there, because the jump is
      # folded into the condition's. Coverage then reports such a line as
      # unexecuted even though it runs — `_weighted_sse` and
      # `_residual_metrics` in doe/calibrate.py each have one, and their tests
      # pass on 3.9 while the lines read as uncovered. Marking them
      # `# pragma: no cover` would hide lines that are genuinely covered
      # everywhere else, so 3.9 runs the same tests without the threshold.
      - name: Run tests
        if: matrix.python-version != '3.9'
        run: |
          pytest tests/ -v --tb=short --cov=doe --cov-report=xml --cov-report=html --cov-fail-under=100

      - name: Run tests (no coverage threshold)
        if: matrix.python-version == '3.9'
        run: |
          pytest tests/ -v --tb=short

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          # Public repos work tokenless, but v4+ uploads are flaky without it;
          # set the CODECOV_TOKEN repo secret to make uploads reliable.
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml
          retention-days: 7

  # Every change moves the version (shared_tools BN-002). The first step fails
  # when pyproject.toml, doe/__init__.py and CITATION.cff disagree, or
  # CHANGELOG.md does not open with that version, numbered and dated. On a
  # pull request the second fails unless the version is greater than the base
  # branch's; on a push to main the third fails unless it is greater than what
  # main had before the push. tests/check_version.sh is shared_tools'
  # templates/check_version.sh with this repository's places.
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Every place the version is written agrees
        run: bash tests/check_version.sh
      - name: The version moved past the base branch's
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE"
          bash tests/check_version.sh FETCH_HEAD
      - name: The version moved past main's before this push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          case "$BEFORE" in ''|0000000000000000000000000000000000000000) exit 0 ;; esac
          git fetch --depth=1 origin "$BEFORE"
          bash tests/check_version.sh FETCH_HEAD
