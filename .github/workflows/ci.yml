name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit

      - name: Check dependencies for vulnerabilities
        run: |
          pip-audit --skip-editable

      - name: Check REUSE license compliance
        run: |
          pip install reuse
          reuse lint

      - name: Syntax check
        run: |
          python -m compileall -q doe tests

      - name: Lint (ruff, fail-on-issue)
        run: |
          pip install ruff
          ruff check doe tests

      - name: Security analysis (bandit)
        run: |
          pip install bandit
          bandit -r doe --exit-zero

      - name: Type check (mypy)
        run: |
          pip install mypy
          mypy doe

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=doe --cov-report=xml --cov-report=html --cov-fail-under=75

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml
