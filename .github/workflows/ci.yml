name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check dependencies for vulnerabilities
        run: |
          pip-audit --skip-editable

      - name: Check REUSE license compliance (doe/ source)
        run: |
          # Scoped to the doe/ Python package: every source file must carry an
          # SPDX header and its license must exist under LICENSES/. The wider
          # repo (generated website/, docs, build artifacts) is not yet fully
          # REUSE-annotated; tracked via a follow-up issue.
          reuse lint-file $(git ls-files 'doe/**/*.py' 'doe/*.py')

      - name: Syntax check
        run: |
          python -m compileall -q doe tests

      - name: Lint (ruff, fail-on-issue)
        run: |
          ruff check doe tests

      - name: Security analysis (bandit)
        run: |
          bandit -r doe --exit-zero

      - name: Type check (mypy)
        run: |
          mypy doe

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=doe --cov-report=xml --cov-report=html --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml
