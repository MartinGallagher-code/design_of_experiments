name: Auto-release

# Detects version bumps in pyproject.toml on the main branch and, when the
# version is new, creates a matching git tag and GitHub release, then builds
# and publishes the package to PyPI (trusted publishing via the `pypi`
# environment).
#
# Publishing lives in this workflow rather than a separate `on: release`
# workflow because the release here is created with GITHUB_TOKEN, and GitHub
# suppresses workflow triggers for events created by GITHUB_TOKEN — a
# separate release-triggered publish workflow would never run.
#
# The release body comes from CHANGELOG.md — we extract the section between
# the version header and the next `## ` so each release ships with the
# notes the maintainer already wrote.
#
# The publish job runs on every trigger and is idempotent: skip-existing
# makes re-publishing a version already on PyPI a no-op. This means a
# failed publish can be retried by manual dispatch, or by any push to
# main that touches pyproject.toml.
#
# Manual trigger is supported via workflow_dispatch for cases where the
# version was bumped earlier without firing this workflow.

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.tag_check.outputs.skip }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version from pyproject.toml
        id: version
        run: |
          ver=$(python -c "
          import re, pathlib
          text = pathlib.Path('pyproject.toml').read_text()
          m = re.search(r'^version\s*=\s*\"([^\"]+)\"', text, flags=re.MULTILINE)
          print(m.group(1) if m else '')
          ")
          if [ -z "$ver" ]; then
            echo "Could not read version from pyproject.toml" >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $ver"

      - name: Skip if tag already exists
        id: tag_check
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists locally — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists on origin — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract CHANGELOG section
        if: steps.tag_check.outputs.skip != 'true'
        id: changelog
        run: |
          ver="${{ steps.version.outputs.version }}"
          # awk: capture everything between '## <ver> ...' and the next '## '.
          # The heading may be Keep-a-Changelog style ('## [0.4.0] — date') or
          # bare ('## 0.4.0'), so the brackets are optional and dots in the
          # version are escaped to match literally.
          notes=$(awk -v ver="$ver" '
            BEGIN { gsub(/\./, "\\.", ver) }
            /^## / {
              if (capturing) { exit }
              if ($0 ~ "^## \\[?" ver "\\]?([^0-9]|$)") { capturing = 1; next }
            }
            capturing { print }
          ' CHANGELOG.md)
          if [ -z "$notes" ]; then
            notes="No CHANGELOG entry found for $ver."
          fi
          # Stash to a file because GITHUB_OUTPUT can't carry multiline easily.
          echo "$notes" > /tmp/release-notes.md
          echo "Notes preview (first 20 lines):"
          head -20 /tmp/release-notes.md

      - name: Create GitHub release
        if: steps.tag_check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false

  publish:
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)
      contents: write # attach SBOM files to the release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Generate SBOM
        run: |
          pip install . cyclonedx-bom
          cyclonedx-py environment --output-format JSON --output-file sbom.json
          cyclonedx-py environment --output-format XML --output-file sbom.xml

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Upload SBOM to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            sbom.json
            sbom.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
