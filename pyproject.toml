[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doehelper"
version = "0.4.2"
description = "A Design of Experiments (DOE) helper tool"
readme = "README.md"
authors = [{name = "Martin J. Gallagher"}]
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
keywords = [
    "doe",
    "doehelper",
    "experiment",
    "factorial",
    "statistics",
    "anova",
    "response-surface",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pyDOE3>=1.0.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scipy>=1.11.0",
    "Jinja2>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/MartinGallagher-code/design_of_experiments"
Documentation = "https://github.com/MartinGallagher-code/design_of_experiments/tree/main/docs"
Repository = "https://github.com/MartinGallagher-code/design_of_experiments"
Changelog = "https://github.com/MartinGallagher-code/design_of_experiments/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/MartinGallagher-code/design_of_experiments/issues"

[project.scripts]
doe = "doe.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.5",
    "mypy>=1.8",
    "bandit>=1.7",
    "reuse>=3.0",
    "pip-audit>=2.6.0",
    "cyclonedx-bom>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["doe*"]

[tool.setuptools.package-data]
doe = ["templates/*.j2", "use_cases/*/config.json", "use_cases/*/sim.sh", "use_cases/*/README.md"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Third-party packages: don't analyze their stubs/sources. Besides the
# missing-stub cases, this avoids mypy choking on newer-than-target syntax
# inside installed stubs (e.g. numpy's __init__.pyi uses PEP 695 `type`
# statements that fail to parse under python_version = 3.10).
[[tool.mypy.overrides]]
module = [
    "pyDOE3.*",
    "matplotlib.*",
    "mpl_toolkits.*",
    "jinja2.*",
    "numpy",
    "numpy.*",
    "scipy",
    "scipy.*",
]
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true
