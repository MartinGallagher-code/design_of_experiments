[mypy]
# Advisory-only config: catches forward-reference typos, missing returns,
# arg-count mismatches without insisting on full strict mode (which would
# flag thousands of legitimate-but-unannotated patterns in a numpy / scipy
# heavy codebase).
python_version = 3.10
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
ignore_missing_imports = True
follow_imports = silent

# Enable when ready to harden:
# disallow_untyped_defs = True
# disallow_incomplete_defs = True
# warn_unreachable = True

[mypy-tests.*]
# Don't bother type-checking tests; they're full of factor_values dicts
# and class fakes that aren't worth the friction.
ignore_errors = True

[mypy-doe.use_cases.*]
# Static use-case templates ship as sample configs, not runnable code.
ignore_errors = True
