version = 1
SPDX-PackageName = "doehelper"
SPDX-PackageSupplier = "Martin J. Gallagher"
SPDX-PackageDownloadLocation = "https://github.com/MartinGallagher-code/design_of_experiments"

# Catch-all for files without their own SPDX headers: documentation, use-case
# data (config.json / sim.sh / README.md), templates, and repo configuration.
# Files that carry an in-file header (doe/**/*.py) take precedence.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Martin J. Gallagher"
SPDX-License-Identifier = "GPL-3.0-or-later"
