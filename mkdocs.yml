site_name: DOE Helper
site_description: A Python CLI tool that automates the creation and analysis of experimental designs.
site_url: https://doehelper.readthedocs.io/
repo_url: https://github.com/MartinGallagher-code/design_of_experiments
repo_name: MartinGallagher-code/design_of_experiments
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - User Guide: user_guide.md
  - DOE Fundamentals: doe_fundamentals.md
  - Cookbook: cookbook.md
  - Adaptive Strategies: strategies.md
  - Reference:
      - Command Reference: commands.md
      - Config Reference: config.md
      - Public API: api.md
  - Development:
      - Releasing: releasing.md
      - Release Process: RELEASE.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
